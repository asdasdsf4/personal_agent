services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"

      - key: NODE_OPTIONS
        value: "--max-old-space-size=1024"

      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw

      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace

      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false
